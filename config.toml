enable-module-update = true
parallel-jobs = 1

patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-desktop"
rv-brand = "Morphe"

# ============================================================
# YouTube
# ============================================================

[YouTube]

uptodown-dlurl = "https://youtube.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
arch = "arm64-v8a"

# Keep the Google package name.
# You have already tested this method successfully.
patcher-args = """\
-OpackageName=com.google.android.youtube \
-e 'Clone app' \
-e 'Disable Play Store updates' \
"""


# ============================================================
# YouTube Music
# ============================================================

[YouTube-Music]

uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"
arch = "arm64-v8a"

# Keep the Google package name.
# GmsCore support remains enabled by the Morphe patch bundle.
patcher-args = """\
-OpackageName=com.google.android.apps.youtube.music \
-e 'Clone app' \
-e 'Disable Play Store updates' \
"""


# ============================================================
# Reddit
# ============================================================

[Reddit]

uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.reddit.frontpage"
arch = "arm64-v8a"


# ============================================================
# Google Photos - De-Vanced
# ============================================================

[Google-Photos]

patches-source = "RookieEnough/De-Vanced"
cli-source = "MorpheApp/morphe-desktop"
rv-brand = "De-Vanced"

uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.photos"

arch = "arm64-v8a"

# Clone the patched Photos app so it can coexist with
# the official Google Photos app.
#
# Official:
#   com.google.android.apps.photos
#
# Patched:
#   app.morphe.android.apps.photos
#
# No De-Vanced patches are excluded.
patcher-args = """\
-OpackageName=app.morphe.android.apps.photos \
-e 'Clone app' \
"""
